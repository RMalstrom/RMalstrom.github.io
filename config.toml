baseURL = "https://rmalstrom.github.io/"
title = "Ricky Malstrom"
languageCode = "en-us"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "Mechatronics, CAD, and embedded systems. Projects built and documented by Ricky Malstrom."
  author = "Ricky Malstrom"
  mainSections = ["projects", "posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  DateFormat = "January 2006"
  [params.label]
    text = "Ricky Malstrom"
  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"
    apple_touch_icon = "/favicon.svg"
    safari_pinned_tab = "/favicon.svg"
    disableHLJS = true
  [params.cover]
    hiddenInList = true
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/RMalstrom"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:maldev@proton.me"

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 1
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2
[[menu.main]]
  name = "Notes"
  url = "/posts/"
  weight = 3
[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 4
[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 5
